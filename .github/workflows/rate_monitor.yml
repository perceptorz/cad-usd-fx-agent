name: LooniePulse FX 24/7 Cloud Tracker & Daily Briefing

on:
  schedule:
    # Runs automatically every 30 minutes 24/7/365
    - cron: '*/30 * * * *'
    # Dedicated morning trigger at 13:00 UTC (9:00 AM EDT / 8:00 AM CDT)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      force_digest:
        description: 'Force send Daily Morning Briefing right now'
        required: false
        type: boolean
        default: false

jobs:
  track-cad-usd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Cloud FX Intelligence Check & Daily Digest
        env:
          TARGET_RATE: ${{ vars.TARGET_RATE || '0.7300' }}
          DIGEST_HOUR_UTC: ${{ vars.DIGEST_HOUR_UTC || '13' }}
          DAILY_DIGEST: ${{ inputs.force_digest && 'true' || 'false' }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 cloud_monitor.py
